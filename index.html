<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuzzerBeater Dashboard v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-sans-tc@latest/chinese-traditional-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-sans-tc@latest/chinese-traditional-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-sans-tc@latest/chinese-traditional-900-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/chakra-petch@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/chakra-petch@latest/latin-700-normal.css">
<style>
:root{
  --bg:#070b14; --bg2:#0c1220; --panel:rgba(255,255,255,.038); --panel2:rgba(255,255,255,.062);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#e8edf7; --tx2:#9aa7bf; --tx3:#63708a;
  --org:#ff7a1a; --org2:#ffb03a; --cy:#26d7e8; --grn:#3ddc97; --pur:#a78bfa; --red:#ff5470; --yel:#ffd166;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:'Noto Sans TC','Chakra Petch',system-ui,sans-serif;
  font-size:14px; line-height:1.55; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-2;
  background:
    radial-gradient(1100px 600px at 12% -8%, rgba(255,122,26,.16), transparent 60%),
    radial-gradient(900px 520px at 92% 4%, rgba(38,215,232,.13), transparent 62%),
    radial-gradient(800px 700px at 50% 110%, rgba(167,139,250,.10), transparent 60%),
    linear-gradient(180deg,#070b14,#080d18 40%,#060911);
}
body::after{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.30;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 65% at 50% 0%,#000 20%,transparent 80%);
}
.num{font-family:'Chakra Petch','Noto Sans TC',monospace;font-variant-numeric:tabular-nums}

/* ===== HEADER ===== */
header{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(13,20,35,.9),rgba(8,12,22,.75))}
.hcourt{position:absolute;right:-90px;top:-120px;width:520px;height:520px;opacity:.16;pointer-events:none}
.hin{position:relative;max-width:1680px;margin:0 auto;padding:20px 26px 0}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:56px;height:56px;flex:0 0 56px;filter:drop-shadow(0 4px 16px rgba(255,122,26,.45))}
.brand h1{font-size:23px;font-weight:900;letter-spacing:.5px;line-height:1.2}
.brand h1 span{color:var(--org)}
.brand .sub{color:var(--tx2);font-size:12.5px;letter-spacing:2px;text-transform:uppercase;font-family:'Chakra Petch'}
.hstats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.hstat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 15px;min-width:96px;text-align:center}
.hstat b{display:block;font-size:20px;font-weight:700;font-family:'Chakra Petch';color:var(--org2);line-height:1.15}
.hstat i{font-style:normal;font-size:11px;color:var(--tx3);letter-spacing:.6px}

nav{position:sticky;top:0;z-index:60;max-width:1680px;margin:0 auto;padding:14px 26px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  background:rgba(7,11,20,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tab{border:1px solid transparent;background:transparent;color:var(--tx2);padding:9px 17px;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:700;letter-spacing:.4px;transition:.18s;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--tx);background:var(--panel)}
.tab.on{color:#0b0f18;background:linear-gradient(135deg,var(--org2),var(--org));box-shadow:0 6px 20px rgba(255,122,26,.32)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.navright{margin-left:auto;display:flex;gap:8px;align-items:center}

main{max-width:1680px;margin:0 auto;padding:22px 26px 70px}
.view{display:none;animation:fade .3s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== GENERIC ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.card h3{font-size:14px;font-weight:900;letter-spacing:1.4px;color:var(--tx);margin-bottom:14px;display:flex;align-items:center;gap:9px;text-transform:uppercase}
.card h3::before{content:'';width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--org),var(--org2))}
.card h3 .hint{font-size:11px;font-weight:400;color:var(--tx3);letter-spacing:0;text-transform:none;margin-left:auto}
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--tx);padding:8px 15px;border-radius:9px;cursor:pointer;
  font-family:inherit;font-size:12.5px;font-weight:700;transition:.16s;letter-spacing:.3px}
.btn:hover{border-color:var(--org);color:var(--org2);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--org),#ff9b3d);color:#12090200;color:#150a02;border-color:transparent}
.btn.pri:hover{color:#150a02;box-shadow:0 6px 18px rgba(255,122,26,.35)}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.cy{border-color:rgba(38,215,232,.5);color:var(--cy)}
.btn.cy:hover{background:rgba(38,215,232,.14);color:#7ff0fb}
.btn.dg:hover{border-color:var(--red);color:var(--red)}
select,input[type=text],input[type=number]{background:#0d1424;border:1px solid var(--line);color:var(--tx);border-radius:8px;
  padding:7px 10px;font-family:inherit;font-size:12.5px;outline:none;transition:.15s}
select:focus,input:focus{border-color:var(--org);box-shadow:0 0 0 3px rgba(255,122,26,.14)}
select{cursor:pointer}
label.fl{font-size:11.5px;color:var(--tx3);letter-spacing:.5px;display:block;margin-bottom:5px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px;border:1px solid}
.bg-org{color:var(--org2);border-color:rgba(255,122,26,.4);background:rgba(255,122,26,.12)}
.bg-cy{color:var(--cy);border-color:rgba(38,215,232,.4);background:rgba(38,215,232,.12)}
.bg-grn{color:var(--grn);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.12)}
.bg-red{color:var(--red);border-color:rgba(255,84,112,.4);background:rgba(255,84,112,.12)}
.bg-pur{color:var(--pur);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.12)}
.bg-gry{color:var(--tx2);border-color:var(--line);background:rgba(255,255,255,.05)}
.muted{color:var(--tx3)}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.scrollx{overflow-x:auto;scrollbar-width:thin}
.scrollx::-webkit-scrollbar{height:9px;width:9px}
.scrollx::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}
.scrollx::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}

/* ===== PLAYERS TABLE ===== */
.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;min-width:1780px}
.tbl th{position:sticky;top:0;z-index:5;background:#0f1728;color:var(--tx2);font-weight:700;font-size:11px;letter-spacing:.5px;
  padding:9px 6px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:center}
.tbl th.grpO{color:var(--cy)} .tbl th.grpI{color:var(--org2)} .tbl th.grpP{color:var(--pur)}
.tbl td{padding:4px 4px;border-bottom:1px solid rgba(255,255,255,.045);text-align:center;white-space:nowrap}
.tbl tbody tr:hover td{background:rgba(255,255,255,.035)}
.tbl tbody tr.sel td{background:rgba(255,122,26,.08)}
.tbl td.stick,.tbl th.stick{position:sticky;left:0;z-index:4;background:#0b1120;text-align:left;padding-left:10px}
.tbl td.stick2,.tbl th.stick2{position:sticky;left:190px;z-index:4;background:#0b1120}
.tbl tbody tr:hover td.stick,.tbl tbody tr:hover td.stick2{background:#131c30}
.tbl td.stick2::after,.tbl th.stick2::after{content:'';position:absolute;right:-1px;top:0;bottom:0;width:1px;background:var(--line)}
.pname{display:flex;align-items:center;gap:9px}
.pnum{width:29px;height:29px;flex:0 0 29px;border-radius:8px;display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;
  font-size:13px;background:linear-gradient(145deg,#1d2740,#141c2e);border:1px solid var(--line2);color:var(--org2)}
.pname b{font-weight:700;font-size:12.8px;letter-spacing:.2px}
.pname small{display:block;color:var(--tx3);font-size:10.5px;letter-spacing:.5px}
.cellin{width:46px;padding:5px 3px!important;text-align:center;border-radius:6px;font-family:'Chakra Petch';font-weight:600;font-size:12.5px;border:1px solid rgba(255,255,255,.13)!important;background:#101828}
.cellin:hover{border-color:var(--org)!important}
.cellin.wide{width:74px}
.stepper{display:flex;align-items:center;gap:2px;justify-content:center}
.stepper button{width:19px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);
  cursor:pointer;font-size:12px;line-height:1;font-family:inherit;padding:0}
.stepper button:hover{border-color:var(--org);color:var(--org2)}
.stepper input{width:38px;text-align:center;padding:3px 0;border-radius:5px;font-family:'Chakra Petch';font-weight:700}
.calc{font-family:'Chakra Petch';font-weight:700;font-size:13px}
.posTag{font-family:'Chakra Petch';font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:5px;letter-spacing:.5px}
.pPG{background:rgba(38,215,232,.16);color:#5fe3f0} .pSG{background:rgba(61,220,151,.16);color:#63e8b3}
.pSF{background:rgba(255,209,102,.16);color:#ffdc8a} .pPF{background:rgba(255,122,26,.18);color:#ffa257}
.pC{background:rgba(167,139,250,.18);color:#c3b0fd}
.condPip{display:inline-flex;gap:2px;vertical-align:middle;margin-left:5px}
.condPip s{width:4px;height:11px;border-radius:1px;background:rgba(255,255,255,.14);text-decoration:none;display:block}
.condPip s.on{background:var(--grn)}
.condPip s.warn{background:var(--yel)} .condPip s.bad{background:var(--red)}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--tx3);flex-wrap:wrap}
.lgs{width:52px;height:8px;border-radius:4px;background:linear-gradient(90deg,#1a2233,#2b5f6e,#3fae7a,#f0a92e,#ff5f3d)}

/* ===== LINEUP ===== */
.lugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:18px}
.lu{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:.2s}
.lu::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--org))}
.lu.off{opacity:.42;filter:saturate(.3)}
.lu.act{border-color:var(--c,var(--org));box-shadow:0 0 0 1px var(--c,var(--org)),0 12px 34px rgba(0,0,0,.4)}
.luhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.luhead .tag{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#0a0e17;background:var(--c)}
.luhead input.nm{flex:1;min-width:80px;background:transparent;border:1px solid transparent;font-size:15px;font-weight:900;color:var(--tx);padding:4px 8px}
.luhead input.nm:hover,.luhead input.nm:focus{border-color:var(--line2);background:#0d1424}
.court{background:radial-gradient(ellipse at 50% 0%,rgba(255,122,26,.10),transparent 70%),#0a1020;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:12px}
.court svg{display:block;width:100%;height:auto}
.slotpick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.slot{background:#0d1424;border:1px solid var(--line);border-radius:9px;padding:6px 5px;text-align:center}
.slot .pl{font-size:9.5px;color:var(--tx3);letter-spacing:1px;font-weight:700}
.slot select{width:100%;padding:4px 2px;font-size:10.5px;background:#111a2c;border-color:var(--line);text-align:center}
.tac{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.tac .full{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:4px;background:linear-gradient(90deg,var(--cy),var(--org));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--org);box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--org)}
.rangelbl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);margin-top:3px;letter-spacing:.4px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mini div{background:#0d1424;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.mini b{display:block;font-family:'Chakra Petch';font-size:16px;font-weight:700;line-height:1.2}
.mini i{font-style:normal;font-size:9.5px;color:var(--tx3);letter-spacing:.4px}
.fitbig{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.fitbig b{font-family:'Chakra Petch';font-size:36px;font-weight:700;line-height:1;background:linear-gradient(135deg,#fff,var(--c));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.roster{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;background:#0d1424;border:1px solid var(--line);border-radius:8px;padding:3px 9px 3px 4px;font-size:11.5px}
.chip .n{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;font-size:10.5px;background:#1c2740;color:var(--org2)}
.chip em{font-style:normal;color:var(--tx3);font-size:10px}

/* ===== ANALYSIS ===== */
.anaGrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px}
.dimrow{display:grid;grid-template-columns:88px 1fr 44px;gap:9px;align-items:center;margin-bottom:7px}
.dimrow .lb{font-size:11.5px;color:var(--tx2);text-align:right;font-weight:700}
.dimrow .vv{font-family:'Chakra Petch';font-weight:700;font-size:12.5px;text-align:right}
.contrib{display:grid;grid-template-columns:1fr;gap:5px}
.crow{display:grid;grid-template-columns:132px 1fr 62px;gap:8px;align-items:center;font-size:11.5px}
.crow .who{display:flex;align-items:center;gap:6px;min-width:0}
.crow .who b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.tw{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.twc{background:#0d1424;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.twc .t{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-bottom:5px}
.twc .t b{font-family:'Chakra Petch';color:var(--org2)}
.note{background:rgba(38,215,232,.07);border-left:3px solid var(--cy);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12px;color:#bfe9ef;margin-bottom:7px}
.note.w{background:rgba(255,84,112,.08);border-left-color:var(--red);color:#ffc9d3}
.note.g{background:rgba(61,220,151,.08);border-left-color:var(--grn);color:#bdf3dd}
.note.o{background:rgba(255,122,26,.08);border-left-color:var(--org);color:#ffd9b8}
.note b{color:#fff}

/* ===== COMPARE ===== */
.cmpTbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.cmpTbl th,.cmpTbl td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.cmpTbl th{color:var(--tx3);font-size:11px;letter-spacing:.5px;font-weight:700;background:rgba(255,255,255,.02)}
.cmpTbl td.v{font-family:'Chakra Petch';font-weight:700;text-align:right;width:62px}
.cmpTbl .best{color:var(--grn)}
.cmpTbl .worst{color:var(--red);opacity:.75}
.cmpTbl td.barcell{width:34%}

/* ===== INSIGHT ===== */
.tier{display:flex;gap:9px;align-items:stretch;margin-bottom:9px}
.tierLab{flex:0 0 46px;border-radius:10px;display:grid;place-items:center;font-family:'Chakra Petch';font-weight:700;font-size:19px;color:#0a0e17}
.tierList{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#0b1120;border:1px solid var(--line);border-radius:10px;padding:7px}
.pcard{background:linear-gradient(150deg,#131c2f,#0e1524);border:1px solid var(--line);border-radius:12px;padding:12px;transition:.18s}
.pcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.pchead{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.archetype{font-size:10.5px;padding:2px 7px;border-radius:20px;background:rgba(167,139,250,.15);color:var(--pur);border:1px solid rgba(167,139,250,.32);font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;font-size:11.5px}
.kv dt{color:var(--tx3)} .kv dd{font-family:'Chakra Petch';font-weight:700;text-align:right}
.optRow{display:grid;grid-template-columns:38px 1fr 96px 76px;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:#0d1424;border:1px solid var(--line);margin-bottom:6px;font-size:12px}
.optRow:hover{border-color:var(--line2)}
.optRow .rk{font-family:'Chakra Petch';font-weight:700;font-size:16px;color:var(--tx3);text-align:center}
.optRow.top .rk{color:var(--org2)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:#141d31;border:1px solid var(--org);
  color:var(--tx);padding:11px 22px;border-radius:11px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:.32s;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.foot{max-width:1680px;margin:0 auto;padding:0 26px 34px;color:var(--tx3);font-size:11.5px;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:1080px){.anaGrid{grid-template-columns:1fr}.hstats{width:100%;margin:12px 0 0}}
@media(max-width:640px){main,nav,.hin{padding-left:14px;padding-right:14px}.lugrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <svg class="hcourt" viewBox="0 0 500 470" fill="none">
    <rect x="1" y="1" width="498" height="468" stroke="#ff7a1a" stroke-width="2"/>
    <path d="M30 0 V142 A237 237 0 0 0 470 142 V0" stroke="#ff7a1a" stroke-width="2"/>
    <rect x="170" y="0" width="160" height="190" stroke="#26d7e8" stroke-width="2"/>
    <circle cx="250" cy="190" r="60" stroke="#26d7e8" stroke-width="2"/>
    <circle cx="250" cy="52" r="9" stroke="#ffb03a" stroke-width="2"/>
    <path d="M210 40 H290" stroke="#ffb03a" stroke-width="3"/>
  </svg>
  <div class="hin">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb03a"/><stop offset="1" stop-color="#ff5f1a"/></linearGradient></defs>
        <circle cx="32" cy="32" r="29" fill="url(#lg)"/>
        <circle cx="32" cy="32" r="29" fill="none" stroke="#0a0e17" stroke-width="2.5"/>
        <path d="M32 3v58M3 32h58M11 11c12 10 12 32 0 42M53 11c-12 10-12 32 0 42" stroke="#0a0e17" stroke-width="2.4" fill="none"/>
        <circle cx="32" cy="32" r="12" fill="none" stroke="rgba(10,14,23,.35)" stroke-width="2"/>
      </svg>
      <div>
        <h1>BUZZERBEATER <span>球隊儀表板</span> v5</h1>
        <div class="sub">Roster · Lineup · Tactic Analytics</div>
      </div>
      <div class="hstats" id="hstats"></div>
    </div>
  </div>
  <nav id="nav"></nav>
</header>

<main>

/* ==================== 4. 計算核心 ==================== */
function recalc(p){
  p.out = OUTS.reduce((a,k)=>a+(+p[k]||0),0);
  p.inn = INS.reduce((a,k)=>a+(+p[k]||0),0);
  p.sum = p.out + p.inn;
  p.pos = p.nick.replace(/[0-9]/g,'');
  CATS.forEach(c=>{ p['_c_'+c.k] = Math.max(0, Math.min(1, c.f(p)/CATMAX[c.k])); });
  const cf = 0.72 + 0.28*(clamp(+p.cond||0,1,8)/8);
  const cap = 16 + (+p.st||0)*1.5;
  const over = Math.max(0, (+p.min||0)-cap)/Math.max(cap,1);
  const ff = 1 - Math.min(.18, over*.35);
  const fresh = 1 + Math.min(.05, Math.max(0,(cap-(+p.min||0))/Math.max(cap,1))*.05);
  p.eff = clamp(cf*ff*fresh, .45, 1.15);
  p.cap = cap;
  CATS.forEach(c=>{ p['_e_'+c.k] = p['_c_'+c.k]*p.eff; });
  let offN=0,offD=0,defN=0,defD=0; const w=POSW[p.pos]||POSW.SF;
  OFF_C.forEach(k=>{offN+=w[k]*p['_e_'+k];offD+=w[k];});
  DEF_C.forEach(k=>{defN+=w[k]*p['_e_'+k];defD+=w[k];});
  p.off = offN/offD*100; p.def = defN/defD*100;
  p.reb = p['_e_reb']*100;
  p.pow = p.off*.44 + p.def*.34 + p.reb*.22;
  return p;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function recalcAll(){ P.forEach(recalc); }

function tacticVec(cfg){
  const pv = blend(VEC.fast, VEC.slow, (cfg.pace||50)/100);
  const sv = blend(VEC.peri, VEC.ins, (cfg.style||50)/100);
  const dv = VEC[cfg.def]||VEC.man;
  const yv = VEC[cfg.play]||VEC.none;
  const out={}; let s=0;
  CATS.forEach(c=>{
    out[c.k]= pv[c.k]*.18 + sv[c.k]*.28 + dv[c.k]*.22 + yv[c.k]*.32;
    s+=out[c.k];
  });
  CATS.forEach(c=>out[c.k]/= (s||1));
  return out;
}
function blend(a,b,t){const o={};CATS.forEach(c=>o[c.k]=a[c.k]*(1-t)+b[c.k]*t);return o}

function analyze(lu){
  const cfg=lu.cfg, tv=tacticVec(cfg), rw=ROLEW[cfg.play]||ROLEW.none;
  const five=SLOTS.map(s=>byNum(lu.slots[s])).filter(Boolean);
  let rwSum=SLOTS.reduce((a,s)=>a+(rw[s]||1),0)||1;
  const cat={}, catRaw={};
  CATS.forEach(c=>{
    let n=0,r=0;
    SLOTS.forEach(s=>{const p=byNum(lu.slots[s]); const w=(rw[s]||1)/rwSum; if(p){n+=w*p['_e_'+c.k]; r+=w*p['_c_'+c.k];}});
    cat[c.k]=n*100; catRaw[c.k]=r*100;
  });
  let fit=0; CATS.forEach(c=>fit+=tv[c.k]*cat[c.k]);
  const off = five.length? five.reduce((a,p)=>a+p.off,0)/five.length : 0;
  const def = five.length? five.reduce((a,p)=>a+p.def,0)/five.length : 0;
  const reb = cat['reb'];
  const avg = k => five.length? five.reduce((a,p)=>a+(+p[k]||0),0)/five.length : 0;
  const sum = k => five.reduce((a,p)=>a+(+p[k]||0),0);
  const bench = P.filter(p=>!Object.values(lu.slots).includes(p.num));
  const benchSorted = bench.slice().sort((a,b)=>b.pow-a.pow).slice(0,6);
  const benchPow = benchSorted.length? benchSorted.reduce((a,p)=>a+p.pow,0)/benchSorted.length : 0;
  const startersPow = five.length? five.reduce((a,p)=>a+p.pow,0)/five.length : 0;
  const depth = startersPow*.72 + benchPow*.28;
  const power = fit*.55 + depth*.20 + (avg('cond')/8*100)*.13 + (avg('st')/20*100)*.12;
  const paceIdx = 100 - (cfg.pace||50);
  const insideIdx = cat['post']*.5 + cat['reb']*.3 + cat['size']*.2;
  const outsideIdx = cat['shoot']*.55 + cat['handle']*.25 + cat['fast']*.20;
  return {lu,cfg,tv,rw,five,cat,catRaw,fit,off,def,reb,bench,benchSorted,benchPow,startersPow,depth,power,
    avgAge:avg('age'),avgH:avg('height'),avgCond:avg('cond'),avgSt:avg('st'),avgMin:avg('min'),
    salary:sum('salary'),outSum:sum('out'),inSum:sum('inn'),sumSum:sum('sum'),
    paceIdx,insideIdx,outsideIdx,
    effAvg: five.length? five.reduce((a,p)=>a+p.eff,0)/five.length : 0};
}
function optimize(cfg, cross){
  const g={PG:[],SG:[],SF:[],PF:[],C:[]};
  P.forEach(p=>g[p.pos]&&g[p.pos].push(p));
  if(cross){
    g.PG=g.PG.concat(g.SG); g.SG=g.SG.concat(g.SF); g.SF=g.SF.concat(g.PG.filter(x=>!g.SF.includes(x)));
    g.PF=g.PF.concat(g.C);  g.C =g.C.concat(g.PF.filter(x=>!g.C.includes(x)));
  }
  const res=[];
  for(const a of g.PG)for(const b of g.SG){ if(b.num===a.num)continue;
   for(const c of g.SF){ if(c.num===a.num||c.num===b.num)continue;
    for(const d of g.PF){ if(d.num===a.num||d.num===b.num||d.num===c.num)continue;
     for(const e of g.C){ if(e.num===a.num||e.num===b.num||e.num===c.num||e.num===d.num)continue;
      const m=analyze({slots:{PG:a.num,SG:b.num,SF:c.num,PF:d.num,C:e.num},cfg});
      res.push(m);
     }}}}
  res.sort((x,y)=>y.fit-x.fit);
  return res;
}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function pn(p){return `<span class="num">#${p.num}</span> ${esc(p.name)}`}
function chip(p,extra){return `<span class="chip"><span class="n num">${p.num}</span>${esc(p.name)}${extra?`<em>${extra}</em>`:''}</span>`}
function skillColor(v){
  const t=clamp(v/18,0,1);
  const stops=[[26,34,51],[35,84,102],[48,150,110],[63,174,122],[240,169,46],[255,95,61]];
  const x=t*(stops.length-1), i=Math.min(stops.length-2,Math.floor(x)), f=x-i;
  const c=stops[i].map((a,j)=>Math.round(a+(stops[i+1][j]-a)*f));
  return `rgba(${c[0]},${c[1]},${c[2]},${0.20+t*0.55})`;
}
function txtOn(v){return v>=13?'#0b0f18':'#e8edf7'}
function grade(v){return v>=80?['bg-grn','優秀']:v>=68?['bg-cy','良好']:v>=55?['bg-org','普通']:v>=42?['bg-pur','偏弱']:['bg-red','不足']}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2000)}
function fmt$(v){return '$'+(+v||0).toLocaleString()}
function condPips(c){let h='<span class="condPip">';for(let i=1;i<=8;i++){const on=i<=c;const cl=on?(c>=7?'on':c>=5?'warn':'bad'):'';h+=`<s class="${cl}"></s>`}return h+'</span>'}

/* ==================== 6. SVG 圖表 ==================== */
function radarSVG(series, size=330, cats=CATS){
  const cx=size/2, cy=size/2+4, R=size*0.375, n=cats.length;
  const pt=(i,r)=>{const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]};
  let g='';
  [.25,.5,.75,1].forEach(t=>{
    const p=cats.map((c,i)=>pt(i,R*t).map(v=>v.toFixed(1)).join(',')).join(' ');
    g+=`<polygon points="${p}" fill="none" stroke="rgba(255,255,255,${t===1?.16:.07})" stroke-width="1"/>`;
  });
  cats.forEach((c,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,.07)"/>`});
  let s='';
  series.forEach(se=>{
    const p=cats.map((c,i)=>pt(i,R*clamp(se.vals[i]/100,0,1.02)).map(v=>v.toFixed(1)).join(',')).join(' ');
    s+=`<polygon points="${p}" fill="${se.color}22" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>`;
    cats.forEach((c,i)=>{const [x,y]=pt(i,R*clamp(se.vals[i]/100,0,1.02));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="${se.color}"/>`});
  });
  let lb='';
  cats.forEach((c,i)=>{
    const [x,y]=pt(i,R+22);
    const anchor = Math.abs(x-cx)<8?'middle':(x>cx?'start':'end');
    lb+=`<text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" fill="#8b98b2" font-size="9.6" text-anchor="${anchor}" font-weight="700">${c.n}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size+8}" width="100%" style="max-height:${size+10}px">${g}${s}${lb}</svg>`;
}
function miniRadar(p,size=190){
  const vals=CATS.map(c=>p['_c_'+c.k]*100);
  return radarSVG([{color:'#ff7a1a',vals}],size);
}
function courtSVG(lu,m){
  const sp=SPOTS[m.cfg.play]||SPOTS.none;
  let dots='';
  SLOTS.forEach(s=>{
    const p=byNum(lu.slots[s]); if(!p)return;
    const [x,y]=sp[s];
    const rw=(m.rw[s]||1);
    const rr = 15 + rw*3.2;
    dots+=`<g>
      <circle cx="${x}" cy="${y}" r="${rr+7}" fill="${lu.color}" opacity=".13"/>
      <circle cx="${x}" cy="${y}" r="${rr}" fill="#0d1524" stroke="${lu.color}" stroke-width="2.4"/>
      <text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="14" font-weight="700" font-family="Chakra Petch">${p.num}</text>
      <text x="${x}" y="${y+rr+13}" text-anchor="middle" fill="#9aa7bf" font-size="9.5" font-weight="700">${s}·${esc(p.name.split(' ')[0])}</text>
      ${rw>1.3?`<text x="${x}" y="${y-rr-6}" text-anchor="middle" fill="${lu.color}" font-size="9" font-weight="700">使用率 ×${rw.toFixed(2)}</text>`:''}
    </g>`;
  });
  return `<svg viewBox="0 0 500 400">
    <defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1206"/><stop offset="1" stop-color="#0b1020"/></linearGradient></defs>
    <rect x="0" y="0" width="500" height="400" fill="url(#fl)" opacity=".55"/>
    <rect x="6" y="6" width="488" height="388" fill="none" stroke="rgba(255,176,58,.42)" stroke-width="2"/>
    <path d="M30 6 V120 A237 237 0 0 0 470 120 V6" fill="none" stroke="rgba(255,176,58,.4)" stroke-width="2"/>
    <rect x="172" y="6" width="156" height="184" fill="rgba(255,122,26,.09)" stroke="rgba(38,215,232,.42)" stroke-width="2"/>
    <circle cx="250" cy="190" r="58" fill="none" stroke="rgba(38,215,232,.4)" stroke-width="2"/>
    <path d="M212 190 A58 58 0 0 0 288 190" fill="none" stroke="rgba(38,215,232,.28)" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M214 34 A38 38 0 0 0 286 34" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.6"/>
    <path d="M216 26 H284" stroke="#ffb03a" stroke-width="4"/>
    <circle cx="250" cy="34" r="8" fill="none" stroke="#ff7a1a" stroke-width="3"/>
    <line x1="6" y1="394" x2="494" y2="394" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function onCell(inp,full){
  const p=byNum(inp.dataset.p); if(!p)return;
  const f=inp.dataset.f; let v=parseFloat(inp.value);
  if(isNaN(v))v=0;
  const mx = SKMAP[f]?20 : (f==='cond'?8:f==='min'?48:f==='height'?240:f==='pot'?15:f==='salary'?999999:45);
  v=clamp(v,0,mx); p[f]=v;
  recalc(p);
  if(SKMAP[f]){inp.style.background=skillColor(v);inp.style.color=txtOn(v)}
  refreshRow(p); renderHead(); save();
  if(full) refreshOther();
}
function refreshRow(p){
  const tr=document.querySelector(`#v-players tr[data-id="${p.num}"]`); if(!tr)return;
  const set=(k,v)=>{const e=tr.querySelector(`[data-calc="${k}"]`);if(e)e.textContent=v};
  set('sum',p.sum);set('out',p.out);set('inn',p.inn);
  set('off',p.off.toFixed(1));set('def',p.def.toFixed(1));set('pow',p.pow.toFixed(1));
  const eb=tr.querySelector('td:nth-child(9) .badge');
  if(eb){eb.textContent=(p.eff*100).toFixed(0)+'%';
    eb.className='badge num '+(p.eff>=1?'bg-grn':p.eff>=.9?'bg-cy':p.eff>=.8?'bg-org':'bg-red')}
  const cp=tr.querySelector('.condPip'); if(cp)cp.outerHTML=condPips(+p.cond);
  const ar=tr.querySelector('.archetype'); if(ar)ar.textContent=archetype(p);
}

function applyPreset(k){
  const cfgs={
    best:{pace:50,style:50,def:'man',play:'pnr'},
    fast:{pace:5,style:10,def:'press',play:'motion'},
    slow:{pace:92,style:90,def:'z23',play:'isoPost'},
    def:{pace:60,style:40,def:'z32',play:'none'},
    fresh:{pace:45,style:50,def:'man',play:'motion'}
  };
  const cfg=cfgs[k];
  let pool=P.slice();
  if(k==='fresh'){ pool.forEach(p=>p._sc=p.pow*(0.6+0.4*p.eff)+ (16-Math.min(16,p.min))*0.6); }
  let res;
  if(k==='fresh'){
    // 挑選「效率×戰力」最高且目前出賽時間低的五人
    const g={PG:[],SG:[],SF:[],PF:[],C:[]};
    pool.forEach(p=>g[p.pos].push(p));
    Object.values(g).forEach(a=>a.sort((x,y)=>(y.pow*(0.55+0.45*y.eff)+Math.max(0,16-y.min)*0.7)-(x.pow*(0.55+0.45*x.eff)+Math.max(0,16-x.min)*0.7)));
    const slots={}; SLOTS.forEach(s=>slots[s]=g[s][0].num);
    LU[0].slots=slots; LU[0].cfg=cfg;
  }else{
    res=optimize(cfg,false)[0];
    LU[0].slots=Object.assign({},res.lu.slots); LU[0].cfg=cfg;
  }
  LU[0].name={best:'綜合最佳首發',fast:'極速外線',slow:'內線陣地',def:'防守鐵桶',fresh:'體能充沛'}[k];
  activeLU='A'; save(); renderLineup(); renderHead(); renderNav(); toast(`已套用「${LU[0].name}」預設陣容`);
}

  const dims=[
    ['戰術契合度','fit','#ff7a1a'],['進攻指數','off','#26d7e8'],['防守指數','def','#3ddc97'],
    ['籃板保護',null,'#ffb03a'],['外線火力',null,'#5fe3f0'],['內線火力',null,'#ffa257'],
    ['體能耐力',null,'#a78bfa'],['轉換速度',null,'#ffd166'],['傳球組織',null,'#8ad4ff'],
    ['比賽經驗',null,'#c3b0fd'],['罰球穩定',null,'#9be8c8'],['身高尺寸',null,'#ffb9a1'],
    ['綜合戰力','power','#ff5470'],['板凳深度','benchPow','#7f8ea3']
  ];
  const valOf=(m,k)=>{
    if(k==='fit'||k==='off'||k==='def'||k==='power'||k==='benchPow') return m[k];
    const map={'籃板保護':'reb','外線火力':'shoot','內線火力':'post','體能耐力':'stam','轉換速度':'fast','傳球組織':'pass','比賽經驗':'exp','罰球穩定':'ft','身高尺寸':'size'};
    return m.cat[map[k]]||0;
  };
  const dimRows=dims.map(d=>{
    const vs=list.map(m=>valOf(m,d[1]||d[0]));
    const mx=Math.max(...vs), mn=Math.min(...vs);
    return `<tr>
      <td style="font-weight:700">${d[0]}</td>
      ${vs.map(v=>`<td class="v ${v===mx&&list.length>1?'best':v===mn&&list.length>1?'worst':''}" style="color:${v===mx?d[2]:''}">${v.toFixed(1)}</td>`).join('')}
      <td class="barcell">${vs.map((v,i)=>`<div class="bar" style="margin-bottom:3px"><i style="width:${clamp(v,0,100)}%;background:${list[i].lu.color}"></i></div>`).join('')}</td>
    </tr>`;
  }).join('');

  const scenarios=[

      <tbody>${dimRows}</tbody>

  <div class="card">

      }).join('')}

}

/* ==================== 12. 深度洞察 ==================== */
function archetype(p){
  const c={};CATS.forEach(x=>c[x.k]=p['_c_'+x.k]);
  const score={
   '三分射手':c.shoot*1.5+c.rg*0, '外圍狙擊手':c.shoot*1.4+c.ft*.4,
   '組織核心':c.pass*1.5+c.handle*.7, '雙能衛':c.handle*1.1+c.shoot*.8+c.pass*.6,
   '3D 側翼':c.pdef*1.05+c.shoot*.95, '防守鎖':c.pdef*1.35+c.idef*.5,
   '禁區支柱':c.post*1.05+c.idef*.85+c.reb*.8, '籃板怪':c.reb*1.5+c.idef*.3,
   '攻守全能':(c.shoot+c.post+c.pdef+c.reb)*.62, '活力工兵':c.stam*1.2+c.reb*.6+c.idef*.5,
   '老將導師':c.exp*1.4+c.ft*.5, '潛力新秀':(p.pot/10)*1.6+(1-Math.min(1,(p.age-18)/12))*.5
  };
  return Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
}

    {n:'傳切跑動 + 均衡',cfg:{pace:40,style:50,def:'man',play:'none'}}

  const teamOut=CATS.map(c=>({c,v:Math.max(...P.map(p=>p['_c_'+c.k]))*100,avg:P.reduce((a,p)=>a+p['_c_'+c.k],0)/P.length*100}));

  $('#v-insight').innerHTML=`

      <h3>球員分檔（Tier List） <span class="hint">依位置加權戰力指數排序</span></h3>
      ${tierHTML}
    </div>
    <div class="card">
      <h3>全隊能力上限 vs 平均 <span class="hint">找出球隊的天花板與板凳落差</span></h3>
      ${teamOut.sort((a,b)=>b.v-a.v).map(t=>`
        <div class="dimrow" style="grid-template-columns:88px 1fr 96px">
          <div class="lb">${t.c.n}</div>
          <div style="position:relative">
            <div class="bar" style="height:12px"><i style="width:${t.v}%;background:linear-gradient(90deg,#ff7a1a,#ffb03a)"></i></div>
            <div style="position:absolute;left:${t.avg}%;top:-3px;width:2px;height:18px;background:#26d7e8;box-shadow:0 0 6px #26d7e8"></div>
          </div>
          <div style="text-align:right;font-size:11px"><span class="num" style="color:var(--org2)">${t.v.toFixed(0)}</span> <span class="muted">/</span> <span class="num" style="color:var(--cy)">${t.avg.toFixed(0)}</span></div>
        </div>`).join('')}
      <div class="row" style="margin-top:10px;font-size:11px;color:var(--tx3)"><span><i style="display:inline-block;width:14px;height:8px;background:linear-gradient(90deg,#ff7a1a,#ffb03a);border-radius:2px"></i> 隊內最強</span><span><i style="display:inline-block;width:2px;height:12px;background:#26d7e8"></i> 全隊平均</span></div>
    </div>

  <div class="card" style="margin-bottom:16px">
    <h3>戰術專用最佳陣容產生器 <span class="hint">位置锁定：每個位置 3 人，共 243 種組合全掃描，列出各戰術 Top 3</span></h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">
      ${bestForTactic.map(b=>`
        <div class="pcard">
          <div style="font-weight:900;font-size:13px;margin-bottom:9px;color:var(--org2)">${b.pr.n}</div>
          ${b.top.map((m,i)=>`<div style="margin-bottom:7px">
            <div class="row" style="gap:6px;margin-bottom:3px">
              <span class="badge ${i===0?'bg-org':'bg-gry'} num">#${i+1}</span>

              <button class="btn sm" style="margin-left:auto;padding:2px 8px;font-size:10.5px" data-apply='${JSON.stringify(m.lu.slots)}' data-cfg='${JSON.stringify(b.pr.cfg)}'>套用到 A</button>

          </div>`).join('')}
        </div>`).join('')}
    </div>
  </div>

  <div class="anaGrid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:16px">
    <div class="card">
      <h3>薪金效率 <span class="hint">戰力指數 ÷ 千元週薪</span></h3>
      ${effList.map((x,i)=>`<div class="dimrow" style="grid-template-columns:150px 1fr 52px">
        <div style="display:flex;align-items:center;gap:6px;min-width:0"><span class="pnum num" style="width:22px;height:22px;flex:0 0 22px;font-size:10.5px">${x.p.num}</span><span style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.p.name)}</span></div>

        <div class="vv num">${x.v.toFixed(2)}</div></div>`).join('')}
    </div>
    <div class="card">
      <h3>體能負荷報告 <span class="hint">出賽時間 vs 體能上限（16 + 體能×1.5）</span></h3>
      ${loadList.map(x=>{
        const pct=clamp(x.ratio*100,0,140);
        const st=x.over>4?'bg-red':x.over>0?'bg-org':x.ratio<.35?'bg-cy':'bg-grn';
        const lb=x.over>4?'過度使用':x.over>0?'接近上限':x.ratio<.35?'上場不足':'健康';
        return `<div class="dimrow" style="grid-template-columns:150px 1fr 108px">

            <div style="font-size:9.5px;color:var(--tx3);margin-top:2px" class="num">${x.p.min} 分 / 上限 ${x.p.cap.toFixed(0)} 分（體能 ${x.p.st}）</div></div>
          <div style="text-align:right"><span class="badge ${st}">${lb}</span></div></div>`}).join('')}
    </div>
    <div class="card">
      <h3>未來價值（潛力開發） <span class="hint">目前戰力 + 潛力成長預估</span></h3>
      ${devList.map((x,i)=>`<div class="dimrow" style="grid-template-columns:150px 1fr 96px">

      <div style="text-align:right"><div class="num" style="font-size:17px;font-weight:700;color:var(--org2)">${m.fit.toFixed(1)}</div>
        <button class="btn sm" style="margin-top:2px;padding:1px 7px;font-size:10px" data-apply='${JSON.stringify(m.lu.slots)}'>套用</button></div>
    </div>`).join('')}

  <div class="card" style="margin-bottom:16px">

    ${crossBest.slice(0,5).map((m,i)=>`<div class="optRow ${i===0?'top':''}">
      <div class="rk">${i+1}</div>
      <div><div class="roster" style="margin:0">${SLOTS.map(s=>{const p=byNum(m.lu.slots[s]);return p?`<span class="chip"><span class="n num">${p.num}</span>${esc(p.name.split(' ')[0])}<em>${s}${p.pos!==s?'⚠'+p.pos:''}</em></span>`:''}).join('')}</div></div>
      <div><div class="bar"><i style="width:${clamp(m.fit,0,100)}%;background:var(--cy)"></i></div></div>
      <div class="vv num" style="text-align:right;color:var(--cy)">${m.fit.toFixed(1)}</div>
    </div>`).join('')}
  </div>

  <div class="card">
    <h3>球員定位總表 <span class="hint">自動分類 · 15 人</span></h3>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(258px,1fr))">
      ${sorted.map(p=>`<div class="pcard">
        <div class="pchead"><span class="pnum num">${p.num}</span>
          <div style="flex:1;min-width:0"><b style="font-size:12.5px">${esc(p.name)}</b>
          <div style="font-size:10.5px;color:var(--tx3)"><span class="posTag p${p.pos}">${p.pos}</span> ${esc(p.nick)} · ${p.age}歲 · ${p.height}cm · 潛力${p.pot}</div></div>
          <b class="num" style="color:var(--org2);font-size:17px">${p.pow.toFixed(1)}</b></div>
        <div style="margin-bottom:7px"><span class="archetype">${archetype(p)}</span></div>
        <div class="bar" style="margin-bottom:5px"><i style="width:${p.out/120*100}%;background:#26d7e8"></i></div>
        <div style="font-size:10px;color:var(--tx3);margin-bottom:5px" class="num">外線 ${p.out} / 120</div>
        <div class="bar" style="margin-bottom:5px"><i style="width:${p.inn/80*100}%;background:#ff7a1a"></i></div>
        <div style="font-size:10px;color:var(--tx3);margin-bottom:7px" class="num">內線 ${p.inn} / 80</div>
        <dl class="kv" style="font-size:11px">
          <dt>狀態 / 體能</dt><dd>${p.cond}/8 · ${p.st}/20</dd>
          <dt>效率係數</dt><dd style="color:${p.eff>=1?'var(--grn)':p.eff>=.85?'var(--yel)':'var(--red)'}">${(p.eff*100).toFixed(0)}%</dd>
          <dt>薪金效率</dt><dd>${(p.pow/((+p.salary||1)/1000)).toFixed(2)}</dd>
        </dl>
      </div>`).join('')}
    </div>
  </div>`;

  $$('#v-insight [data-apply]').forEach(b=>b.onclick=()=>{
    LU[0].slots=JSON.parse(b.dataset.apply);
    if(b.dataset.cfg) LU[0].cfg=JSON.parse(b.dataset.cfg);
    save(); toast('已套用到陣容 A，可至「陣容編排」查看'); renderNav(); renderHead();
  });
}

/* ==================== 13. 主渲染 ==================== */
function render(){
  renderNav(); renderHead();
  $$('.view').forEach(v=>v.classList.remove('on'));
  const el=$('#v-'+view); el.classList.add('on');
  if(view==='players') renderPlayers();
  else if(view==='lineup') renderLineup();
  else if(view==='tactic') renderTactic();
  else if(view==='compare') renderCompare();
  else renderInsight();
}
load(); recalcAll(); render();
</script>
